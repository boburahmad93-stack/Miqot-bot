<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buyurtma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf5ef;
    --card:#ffffff;
    --ink:#2b2320;
    --ink-soft:#8b8078;
    --accent1:#ff7a45;
    --accent2:#ff3d5a;
    --accent-soft:#fff1ea;
    --line:#f0e6da;
    --shadow: 0 10px 24px rgba(43,35,32,0.08);
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:96px;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}

  header{
    padding:20px 18px 14px;
    display:flex;align-items:center;gap:12px;
  }
  header img.logo{width:46px;height:46px;border-radius:14px;object-fit:cover;box-shadow:var(--shadow);}
  header .logo-fallback{
    width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent1),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);
  }
  header .titles h1{font-size:18px;font-weight:700;}
  header .titles p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}

  .chips{display:flex;gap:8px;padding:2px 18px 16px;overflow-x:auto;}
  .chip{
    background:var(--card);border:1.5px solid var(--line);padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-soft);
  }
  .chip.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border-color:transparent;}

  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px;
  }
  .dish-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .dish-photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--accent-soft);}
  .dish-photo-fallback{
    width:100%;aspect-ratio:1/1;background:var(--accent-soft);display:flex;align-items:center;
    justify-content:center;font-size:34px;
  }
  .dish-info{padding:10px 12px 12px;}
  .dish-name{font-size:13.5px;font-weight:600;line-height:1.25;margin-bottom:2px;}
  .dish-desc{font-size:11px;color:var(--ink-soft);margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .dish-bottom{display:flex;align-items:center;justify-content:space-between;}
  .dish-price{font-weight:700;font-size:14px;}
  .add-btn{
    width:30px;height:30px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
    font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 10px rgba(255,61,90,0.35);
  }
  .qty-pill{
    display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:999px;padding:3px 6px;
  }
  .qty-pill button{
    width:24px;height:24px;border-radius:50%;border:none;background:#fff;color:var(--accent2);
    font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.08);
  }
  .qty-pill span{font-size:13px;font-weight:600;min-width:14px;text-align:center;}

  .empty-state{padding:60px 24px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* floating cart bar */
  .cart-bar{
    position:fixed;left:16px;right:16px;bottom:16px;
    background:var(--ink);color:#fff;border-radius:18px;
    padding:14px 18px;display:none;align-items:center;justify-content:space-between;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);z-index:40;cursor:pointer;
  }
  .cart-bar.show{display:flex;}
  .cart-bar .cb-left{font-size:13px;opacity:0.85;}
  .cart-bar .cb-total{font-weight:700;font-size:16px;}

  /* sheet (savat / checkout) */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(30,20,15,0.45);display:none;z-index:50;
  }
  .sheet-overlay.show{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;background:var(--bg);
    border-radius:24px 24px 0 0;padding:20px 18px 24px;max-height:85vh;overflow-y:auto;
    z-index:51;transform:translateY(100%);transition:transform 0.25s ease;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .sheet h2{font-size:17px;margin-bottom:14px;}

  .cart-line{
    display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .cart-line:last-child{border-bottom:none;}
  .cl-name{font-size:13.5px;font-weight:600;}
  .cl-sub{font-size:11.5px;color:var(--ink-soft);}
  .cart-total-row{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:12px;margin-top:6px;}

  .primary-btn{
    width:100%;padding:14px 0;border-radius:14px;border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
    font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:14px;
    box-shadow:0 8px 20px rgba(255,61,90,0.3);
  }
  .ghost-btn{
    width:100%;padding:12px 0;border-radius:14px;border:1.5px solid var(--line);background:transparent;
    color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;margin-top:8px;
  }

  label{font-size:12px;color:var(--ink-soft);display:block;margin:12px 0 4px;}
  input,textarea{
    width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent1);}
  .loc-btn{
    width:100%;padding:11px 0;border-radius:12px;border:1.5px dashed var(--accent1);
    background:var(--accent-soft);color:var(--accent2);font-weight:600;font-size:13.5px;
    cursor:pointer;margin-top:6px;
  }
  .loc-status{font-size:12px;color:var(--ink-soft);margin-top:6px;}

  .confirm{text-align:center;padding:20px 0;}
  .confirm .big{font-size:44px;margin-bottom:8px;}
</style>
</head>
<body>

<header id="app-header">
  <div id="logo-slot"></div>
  <div class="titles">
    <h1 id="business-name">Yuklanmoqda...</h1>
    <p>Taom tanlang va buyurtma bering</p>
  </div>
</header>

<div class="chips"><div class="chip active">Barcha taomlar</div></div>

<div class="grid" id="menu-grid"></div>

<div class="cart-bar" id="cart-bar">
  <div class="cb-left"><span id="cart-count">0</span> ta mahsulot</div>
  <div class="cb-total" id="cart-bar-total">0 SAR</div>
</div>

<!-- SAVAT SHEET -->
<div class="sheet-overlay" id="cart-overlay"></div>
<div class="sheet" id="cart-sheet">
  <div class="sheet-handle"></div>
  <h2>Savatingiz</h2>
  <div id="cart-lines"></div>
  <div class="cart-total-row"><span>Jami</span><span id="cart-total-amt">0 SAR</span></div>
  <button class="primary-btn" id="go-checkout-btn">Buyurtma berish</button>
  <button class="ghost-btn" id="close-cart-btn">Yopish</button>
</div>

<!-- CHECKOUT SHEET -->
<div class="sheet-overlay" id="checkout-overlay"></div>
<div class="sheet" id="checkout-sheet">
  <div class="sheet-handle"></div>
  <h2>Ma'lumotlaringiz</h2>
  <label for="in-name">Ismingiz</label>
  <input type="text" id="in-name" placeholder="Ismingiz">
  <label for="in-phone">Telefon raqami</label>
  <input type="tel" id="in-phone" placeholder="05xxxxxxxx">
  <button class="loc-btn" id="get-location-btn">📍 Joylashuvimni aniqlash</button>
  <div class="loc-status" id="loc-status"></div>
  <label for="in-address">Yoki manzilni yozing</label>
  <textarea id="in-address" rows="2" placeholder="Shahar, mahalla, uy..."></textarea>
  <label for="in-note">Izoh (ixtiyoriy)</label>
  <input type="text" id="in-note" placeholder="Masalan: achchiq bo'lmasin">
  <div class="loc-status">To'lov: naqd — kuryer yetkazib berganda olinadi.</div>
  <button class="primary-btn" id="submit-order-btn">Buyurtmani tasdiqlash</button>
</div>

<!-- CONFIRM SHEET -->
<div class="sheet-overlay" id="confirm-overlay"></div>
<div class="sheet" id="confirm-sheet">
  <div class="sheet-handle"></div>
  <div class="confirm">
    <div class="big">✅</div>
    <h3>Buyurtmangiz qabul qilindi!</h3>
    <p class="loc-status">Tez orada siz bilan bog'lanamiz.</p>
    <button class="primary-btn" id="close-app-btn">Yopish</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

let menu = [];
let cart = {}; // id -> qty
let userLocation = null;

function fmtSar(n){ return Math.round(n).toLocaleString('en-US') + " SAR"; }

async function loadMenu(){
  try{
    const res = await fetch('/api/menu');
    const data = await res.json();
    menu = data.menu || [];
    document.getElementById('business-name').textContent = data.business_name || "Uy oshxonasi";
    const logoSlot = document.getElementById('logo-slot');
    if(data.logo_url){
      logoSlot.innerHTML = `<img class="logo" src="${data.logo_url}" alt="logo">`;
    }else{
      logoSlot.innerHTML = `<div class="logo-fallback">🍽️</div>`;
    }
    renderMenu();
  }catch(e){
    document.getElementById('menu-grid').innerHTML = '<div class="empty-state">Menyuni yuklab bo\'lmadi.</div>';
  }
}

function renderMenu(){
  const grid = document.getElementById('menu-grid');
  if(menu.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Menyu hozircha bo\'sh.</div>';
    return;
  }
  grid.innerHTML = '';
  menu.forEach(dish=>{
    const qty = cart[dish.id] || 0;
    const card = document.createElement('div');
    card.className = 'dish-card';
    const photoHtml = dish.photo_url
      ? `<img class="dish-photo" src="${dish.photo_url}" alt="${dish.name}">`
      : `<div class="dish-photo-fallback">🍲</div>`;
    const bottomHtml = qty > 0
      ? `<div class="qty-pill">
           <button data-act="dec" data-id="${dish.id}">−</button>
           <span>${qty}</span>
           <button data-act="inc" data-id="${dish.id}">+</button>
         </div>`
      : `<button class="add-btn" data-act="inc" data-id="${dish.id}">+</button>`;
    card.innerHTML = `
      ${photoHtml}
      <div class="dish-info">
        <div class="dish-name">${dish.name}</div>
        ${dish.desc ? `<div class="dish-desc">${dish.desc}</div>` : '<div class="dish-desc">&nbsp;</div>'}
        <div class="dish-bottom">
          <div class="dish-price">${fmtSar(dish.price)}</div>
          ${bottomHtml}
        </div>
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-id');
      const act = btn.getAttribute('data-act');
      const cur = cart[id] || 0;
      const next = act === 'inc' ? cur + 1 : Math.max(0, cur - 1);
      if(next === 0) delete cart[id]; else cart[id] = next;
      renderMenu();
      updateCartBar();
    });
  });
}

function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const dish = menu.find(d=>String(d.id)===String(id));
    return sum + (dish ? dish.price*qty : 0);
  },0);
}

function updateCartBar(){
  const count = cartCount();
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-bar-total').textContent = fmtSar(cartTotal());
  document.getElementById('cart-bar').classList.toggle('show', count > 0);
}

function openSheet(id){
  document.getElementById(id + '-overlay').classList.add('show');
  document.getElementById(id + '-sheet').classList.add('show');
}
function closeSheet(id){
  document.getElementById(id + '-overlay').classList.remove('show');
  document.getElementById(id + '-sheet').classList.remove('show');
}

document.getElementById('cart-bar').addEventListener('click', ()=>{
  renderCartSheet();
  openSheet('cart');
});
document.getElementById('cart-overlay').addEventListener('click', ()=>closeSheet('cart'));
document.getElementById('close-cart-btn').addEventListener('click', ()=>closeSheet('cart'));

function renderCartSheet(){
  const linesEl = document.getElementById('cart-lines');
  const entries = Object.entries(cart);
  if(entries.length === 0){
    linesEl.innerHTML = '<div class="loc-status">Savat bo\'sh.</div>';
  }else{
    linesEl.innerHTML = entries.map(([id,qty])=>{
      const dish = menu.find(d=>String(d.id)===String(id));
      if(!dish) return '';
      return `<div class="cart-line">
        <div><div class="cl-name">${dish.name}</div><div class="cl-sub">× ${qty}</div></div>
        <div class="cl-name">${fmtSar(dish.price*qty)}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('cart-total-amt').textContent = fmtSar(cartTotal());
}

document.getElementById('go-checkout-btn').addEventListener('click', ()=>{
  if(cartCount() === 0) return;
  closeSheet('cart');
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if(tgUser && tgUser.first_name){
    document.getElementById('in-name').value = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
  }
  openSheet('checkout');
});
document.getElementById('checkout-overlay').addEventListener('click', ()=>closeSheet('checkout'));

document.getElementById('get-location-btn').addEventListener('click', ()=>{
  const statusEl = document.getElementById('loc-status');
  if(!navigator.geolocation){
    statusEl.textContent = "Bu qurilmada joylashuvni aniqlab bo'lmadi. Manzilni yozing.";
    return;
  }
  statusEl.textContent = "Aniqlanmoqda...";
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      userLocation = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
      statusEl.textContent = "✅ Joylashuv aniqlandi.";
    },
    ()=>{
      statusEl.textContent = "Joylashuvga ruxsat berilmadi. Manzilni yozing.";
    }
  );
});

document.getElementById('submit-order-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('in-name').value.trim();
  const phone = document.getElementById('in-phone').value.trim();
  const addressText = document.getElementById('in-address').value.trim();
  const note = document.getElementById('in-note').value.trim();
  const statusEl = document.getElementById('loc-status');

  if(!phone || (!userLocation && !addressText)){
    statusEl.textContent = "Telefon va manzil (yoki joylashuv) kerak.";
    return;
  }

  const payload = {
    initData: tg ? tg.initData : "",
    cart: cart,
    name: name,
    phone: phone,
    address_text: addressText || null,
    latitude: userLocation ? userLocation.latitude : null,
    longitude: userLocation ? userLocation.longitude : null,
    note: note
  };

  try{
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok){
      statusEl.textContent = data.error || "Xatolik yuz berdi.";
      return;
    }
    cart = {};
    updateCartBar();
    closeSheet('checkout');
    openSheet('confirm');
  }catch(e){
    statusEl.textContent = "Internet aloqasida muammo.";
  }
});

document.getElementById('close-app-btn').addEventListener('click', ()=>{
  closeSheet('confirm');
  if(tg) tg.close();
});

loadMenu();
</script>
</body>
</html>
